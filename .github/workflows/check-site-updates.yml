name: Check La Tour-de-Peilz site for updates

"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "psycopg[binary]" requests "pymupdf>=1.27"

      - name: Run update check
        id: update_check
        env:
          POSTGRES_V2_URL: ${{ secrets.POSTGRES_V2_URL }}
        run: python embedding-pilot/scripts/check_for_updates.py

      - name: Report successful check
        if: ${{ success() }}
        shell: bash
        run: |
          if [ "${{ steps.update_check.outputs.changes_count }}" = "0" ]; then
            echo "::notice title=Update check completed::No site changes detected. All ${{ steps.update_check.outputs.documents_count }} documents were checked successfully."
          else
            echo "::notice title=Update check completed::${{ steps.update_check.outputs.changes_count }} change(s) detected across ${{ steps.update_check.outputs.documents_count }} documents."
          fi

      - name: Report incomplete check
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "## ❌ Vérification incomplète" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Une source n'a pas pu être vérifiée. Ce statut ne signifie pas « aucun changement »." >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Update check incomplete::At least one source could not be verified; inspect the failed step above."
